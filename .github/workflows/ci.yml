# Checks every push and pull request. On `main`, the tested VPS build is attached
# to a pre-release named build-<commit>, which deploy/release.py downloads, so the
# production server never compiles or runs the heavy checks itself.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Verify the VPS build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: System packages for PDF, OCR, media, backup and off-site tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            poppler-utils ffmpeg tesseract-ocr tesseract-ocr-ron tesseract-ocr-eng \
            fonts-dejavu-core fontconfig gnupg rclone
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint -- --max-warnings=0
      - run: ./node_modules/.bin/tsc --noEmit --incremental false
      - run: npm run build:vps
      - name: Generated images match the committed ones
        run: git diff --exit-code -- lib/generated-images.ts public/optimized
      - run: npm run test:vps
        timeout-minutes: 15
      - run: node --test tests/ui-components.test.mjs
      - name: Python tests for backup, release, off-site copy, monitoring and notifications
        timeout-minutes: 10
        run: |
          npm run test:backup
          npm run test:release
          npm run test:external
          PYTHONDONTWRITEBYTECODE=1 python3 tests/operations-status.test.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/notify-comments.test.py
          PYTHONDONTWRITEBYTECODE=1 python3 tests/update-geoip.test.py
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e
        timeout-minutes: 10
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - run: node scripts/package-build.mjs build-out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: poetio-build-${{ github.sha }}
          path: build-out/
          retention-days: 30
          if-no-files-found: error

  worker:
    # The Cloudflare variant is not deployed today. This job keeps it buildable
    # without blocking the VPS build; remove it if the variant is retired.
    name: Cloudflare Worker variant
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: node --test tests/worker.test.mjs

  publish:
    name: Publish the tested build
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: poetio-build-${{ github.sha }}
          path: build-out
      - name: Attach the build to a pre-release and keep the ten newest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="build-${GITHUB_SHA}"
          gh release create "$tag" build-out/* --target "$GITHUB_SHA" --prerelease \
            --title "Build ${GITHUB_SHA::12}" \
            --notes "Tested VPS build of ${GITHUB_SHA}. Install it on the server with deploy/release.py."
          gh release list --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' |
            while read -r old; do gh release delete "$old" --cleanup-tag --yes; done
