# Include in Poetio's HTTPS server blocks through app.conf.
location = /api/video-files {
    client_max_body_size 101m;
    client_body_timeout 120s;
    auth_basic "Poetio - Administrare";
    auth_basic_user_file /etc/poetio/admin.htpasswd;
    auth_delay 500ms;
    limit_req zone=poetio_admin burst=20 nodelay;
    include /etc/poetio/proxy.conf;
    proxy_read_timeout 300s;
    proxy_set_header oai-authenticated-user-email pensio53@gmail.com;
}
