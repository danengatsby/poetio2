# Install once at /etc/nginx/conf.d/poetio-comments-rate.conf (http context).
# Reading comments is unrestricted; posting is limited per client IP.
map $request_method $poetio_comment_client {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $poetio_comment_client zone=poetio_comments:10m rate=6r/m;
