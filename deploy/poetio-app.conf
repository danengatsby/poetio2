# Shared by poetio.cloud and the existing IP endpoint. Set $poetio_host in
# the enclosing server block, and define the poetio_admin request zone once.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:PoetioTLS:10m;
ssl_session_tickets off;
server_tokens off;
client_max_body_size 6m;
proxy_read_timeout 75s;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options SAMEORIGIN always;
# Browsers that have visited once use HTTPS only for a year. A location that
# sets its own add_header must repeat this line (see image-cache.conf).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Cache-Control "private, no-store" always;

# The application compresses HTML itself; hashed JS/CSS and other static text
# are proxied uncompressed, so compress them here. JSON is left out on purpose.
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript text/javascript image/svg+xml application/manifest+json application/xml;

include /etc/poetio/image-cache.conf;
include /etc/poetio/audio-location.conf;
include /etc/poetio/video-location.conf;
include /etc/poetio/book-location.conf;

location = /signin-with-chatgpt {
    return 303 /admin;
}

# Keep this public route before the protected collection APIs regular expression.
location ~ ^/api/(?:(?:poems|videos|books)/[^/]+|about)/comments/?$ {
    client_max_body_size 16k;
    limit_req zone=poetio_comments burst=2 nodelay;
    limit_req_status 429;
    include /etc/poetio/proxy.conf;
    proxy_set_header oai-authenticated-user-email "";
}

location ~ ^/(admin(?:/|$)|api/admin(?:/|$)|api/poems(?:/|$)|api/videos(?:/|$)|api/books(?:/|$)|api/book-files/[^/]+/validation/?$|api/images/?$) {
    auth_basic "Poetio - Administrare";
    auth_basic_user_file /etc/poetio/admin.htpasswd;
    auth_delay 500ms;
    limit_req zone=poetio_admin burst=20 nodelay;
    include /etc/poetio/proxy.conf;
    # Publication may recheck two legacy audio files (bounded server decoding).
    proxy_read_timeout 300s;
    # Added only after Nginx validates the administrator password.
    proxy_set_header oai-authenticated-user-email pensio53@gmail.com;
}

location / {
    # Credentials must be validated before adding the owner identity.
    error_page 418 = @poetio_authenticated;
    if ($http_authorization != "") { return 418; }
    include /etc/poetio/proxy.conf;
    proxy_set_header oai-authenticated-user-email "";
}

location @poetio_authenticated {
    auth_basic "Poetio - Administrare";
    auth_basic_user_file /etc/poetio/admin.htpasswd;
    auth_delay 500ms;
    include /etc/poetio/proxy.conf;
    proxy_set_header oai-authenticated-user-email pensio53@gmail.com;
}
