# Install once at /etc/nginx/conf.d/poetio-http.conf (http context), before app.conf uses it.
# app.conf adds "private, no-store" only to responses that do not set Cache-Control
# themselves, so pages and files never carry two contradictory Cache-Control headers.
map $upstream_http_cache_control $poetio_cache_control {
    "" "private, no-store";
    default "";
}

# Poetio's own access log (/var/log/nginx/poetio.access.log, see app.conf): the usual
# combined fields, preceded by the site name and followed by the total and upstream
# times, so lines from the four sites on this server are never mixed up again.
log_format poetio_vhost '$host $remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" rt=$request_time ut=$upstream_response_time';

# Poetio has no Server Actions: pages answer only GET and HEAD, and every form posts
# JSON to /api/. A POST to a page is how React Server Action exploits (React2Shell,
# CVE-2025-55182) are delivered, so app.conf refuses it before it reaches Node.
map "$request_method $uri" $poetio_page_post {
    "~^POST /api/" 0;
    "~^POST " 1;
    default 0;
}
