# Install once at /etc/nginx/conf.d/poetio-http.conf (http context), before app.conf uses it.
# app.conf adds "private, no-store" only to responses that do not set Cache-Control
# themselves, so pages and files never carry two contradictory Cache-Control headers.
map $upstream_http_cache_control $poetio_cache_control {
    "" "private, no-store";
    default "";
}
