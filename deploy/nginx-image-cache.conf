# Only fingerprinted build assets and generated static images are immutable.
# Override the server's blanket no-store while retaining security headers.
location ^~ /_next/static/ {
    include /etc/poetio/proxy.conf;
    proxy_set_header oai-authenticated-user-email "";
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
}
location ^~ /optimized/ {
    include /etc/poetio/proxy.conf;
    proxy_set_header oai-authenticated-user-email "";
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
}
location ^~ /assets/ {
    include /etc/poetio/proxy.conf;
    proxy_set_header oai-authenticated-user-email "";
    # Unversioned originals retain the runtime's short cache lifetime and ETag.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
}
# Uploaded images revalidate access and attachment before returning a 304.
location ~ ^/api/images/[^/]+/?$ {
    error_page 418 = @poetio_image_owner;
    if ($http_authorization != "") { return 418; }
    include /etc/poetio/proxy.conf;
    proxy_set_header oai-authenticated-user-email "";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
}
location @poetio_image_owner {
    auth_basic "Poetio - Administrare";
    auth_basic_user_file /etc/poetio/admin.htpasswd;
    auth_delay 500ms;
    include /etc/poetio/proxy.conf;
    proxy_set_header oai-authenticated-user-email pensio53@gmail.com;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
}
