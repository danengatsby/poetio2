proxy_pass http://127.0.0.1:4106;
proxy_http_version 1.1;
# Each application server sets this to its fixed public host. Never trust a
# visitor-supplied Host or X-Forwarded-Host when constructing the request origin.
proxy_set_header Host $poetio_host;
proxy_set_header X-Forwarded-Host $poetio_host;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Connection "";
proxy_set_header Authorization "";
proxy_set_header OAI-Sites-Authorization "";
proxy_set_header oai-authenticated-user-full-name "";
proxy_set_header oai-authenticated-user-full-name-encoding "";
proxy_connect_timeout 5s;
proxy_read_timeout 75s;
