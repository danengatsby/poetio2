# Installed as /etc/poetio/media-accel.conf and included by app.conf.
#
# Recordings and films the application has authorized: it answers with
# X-Accel-Redirect and nginx serves the file with Content-Length, ranges, HEAD
# and conditional requests. `internal` makes these paths unreachable from outside.
# nginx reads the files through the poetio group (www-data is a member); the
# directories are 0750 and the files 0640, while the database stays 0600.
location ^~ /_poetio/media/audio/ {
    internal;
    alias /var/lib/poetio/audio/;
    # Content-Type and Cache-Control come from the application's response. A location
    # with add_header does not inherit the server's, so repeat them here.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}

location ^~ /_poetio/media/videos/ {
    internal;
    alias /var/lib/poetio/videos/;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
