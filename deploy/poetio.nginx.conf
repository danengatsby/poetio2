limit_req_zone $binary_remote_addr zone=poetio_admin:10m rate=5r/s;

server {
    listen 8096 ssl;
    listen [::]:8096 ssl;
    server_name 159.69.200.202;

    # Existing certificate for this server IP; its renewal hook reloads Nginx.
    ssl_certificate /etc/amanet/letsencrypt/live/amanet-ip/fullchain.pem;
    ssl_certificate_key /etc/amanet/letsencrypt/live/amanet-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PoetioTLS:10m;
    ssl_session_tickets off;
    server_tokens off;
    client_max_body_size 6m;
    error_page 497 =308 https://159.69.200.202:8096$request_uri;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control "private, no-store" always;

    location = /signin-with-chatgpt {
        return 303 /admin;
    }

    location ~ ^/(admin(?:/|$)|api/poems(?:/|$)|api/images/?$) {
        auth_basic "Poetio - Administrare";
        auth_basic_user_file /etc/poetio/admin.htpasswd;
        auth_delay 500ms;
        limit_req zone=poetio_admin burst=20 nodelay;
        include /etc/poetio/proxy.conf;
        # Added only after Nginx validates the administrator password.
        proxy_set_header oai-authenticated-user-email pensio53@gmail.com;
    }

    location / {
        # Logged-in readers retain owner navigation and access to their own
        # unattached uploads. Presence of credentials never proves identity:
        # the named location must validate them before adding the owner header.
        error_page 418 = @poetio_authenticated;
        if ($http_authorization != "") { return 418; }
        include /etc/poetio/proxy.conf;
        # Public requests cannot supply their own authenticated identity.
        proxy_set_header oai-authenticated-user-email "";
    }

    location @poetio_authenticated {
        auth_basic "Poetio - Administrare";
        auth_basic_user_file /etc/poetio/admin.htpasswd;
        auth_delay 500ms;
        include /etc/poetio/proxy.conf;
        proxy_set_header oai-authenticated-user-email pensio53@gmail.com;
    }
}
