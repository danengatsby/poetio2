limit_req_zone $binary_remote_addr zone=poetio_admin:10m rate=5r/s;

server {
    listen 8096 ssl;
    listen [::]:8096 ssl;
    server_name 159.69.200.202;
    set $poetio_host 159.69.200.202:8096;

    # Existing certificate for this server IP; its renewal hook reloads Nginx.
    ssl_certificate /etc/amanet/letsencrypt/live/amanet-ip/fullchain.pem;
    ssl_certificate_key /etc/amanet/letsencrypt/live/amanet-ip/privkey.pem;
    error_page 497 =308 https://159.69.200.202:8096$request_uri;

    include /etc/poetio/app.conf;
}
