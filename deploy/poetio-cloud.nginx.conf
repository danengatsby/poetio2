server {
    listen 80;
    listen [::]:80;
    server_name poetio.cloud www.poetio.cloud;
    server_tokens off;

    # Keep this reachable over HTTP for unattended certificate renewal.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/poetio-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://poetio.cloud$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name poetio.cloud;
    set $poetio_host poetio.cloud;

    ssl_certificate /etc/letsencrypt/live/poetio.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/poetio.cloud/privkey.pem;

    include /etc/poetio/app.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.poetio.cloud;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/poetio.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/poetio.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PoetioTLS:10m;
    ssl_session_tickets off;

    return 308 https://poetio.cloud$request_uri;
}
